bca_veggiesoup: "Sopa Veggie"
bca_veggiesoup_description: "Uma sopa saudável e nutritiva embalado com vegetais frescos, ervas saborosas, e um caldo saborosa. Perfeito para uma refeição reconfortante e saudável!"
