bca_spicymeatplatter: "Prato de carne picante"
bca_spicymeatplatter_description: "Uma variedade escaldante de carnes temperadas, grelhadas à perfeição e servidas com um pontapé picante. Perfeito para os amantes do calor!"
bca_spicymeatsupreme: "Carne Spicy Supremo"
bca_spicymeatsupreme_description: "Um prato ousado e ardente embalado com carnes premium, especiarias picantes, e um chute de calor para a explosão final sabor."
bca_spicyserpentmeat: "Carne de Serpente Especiaria"
bca_spicyserpentmeat_description: "Rara e ardente delicadeza das profundezas, esta tenra carne serpente é infundida com calor intenso e especiarias exóticas, deixando uma queimadura persistente com cada mordida."
bca_sweetnspicyfish: "Peixe doce e picante"
bca_sweetnspicyfish_description: "Um equilíbrio perfeito de doçura rica e calor ousado, com peixes tenros vidrados em um molho saborosa com uma pitada de sabor picante."
bca_tomato: "Tomate"
