bca_salted_asksvin_egg: "Ovo Salgado de Asksvin"
bca_salted_asksvin_egg_description: "Uma iguaria rara, conhecida por seu sabor rico e saboroso e textura cremosa. Envelhecido em uma salmoura especial, oferece um equilíbrio perfeito de salinidade e umami, tornando-o um ingrediente valioso em pratos gourmet."
bca_salted_asksvinmeat: "Carne Salgada de Asksvin"
bca_salted_asksvinmeat_description: "Uma delicadeza rara e curada conhecida por seu sabor rico e saboroso e textura tenra."
bca_salted_boarmeat: "Carne de javali salgada"
bca_salted_boarmeat_description: "Um rico e saboroso corte de javali, curado com sal para melhorar seu gosto e preservação. Perfeito para ensopados, grelhar ou cortar como um lanche salgado."
bca_salted_bugmeat: "Carne Salgada de Insetos"
bca_salted_bugmeat_description: "Uma iguaria crocante e cheia de proteínas com um chuto salgado e salgado."
bca_salted_chickenegg: "Ovo de galinha salgado"
bca_salted_chickenegg_description: "Um ovo preservado com um sabor rico, salgado e uma gema firme, cremosa, muitas vezes usado na cozinha asiática."
bca_salted_chickenmeat: "Carne de frango salgada"
bca_salted_chickenmeat_description: "Um produto de avicultura saboroso e curado com um sabor rico e temperado. Perfeito para cozinhar, comer ou melhorar os pratos com um sabor salgado e umami."
bca_salted_deermeat: "Carne de veados salgados"
bca_salted_deermeat_description: "Uma delicadeza de carne de veado curada, preservada com sal para um sabor rico, salgado e uma textura tenra, mas ligeiramente mastigada. Ideal para cozinhar, comer ou adicionar a pratos saudáveis."
bca_salted_fish: "Peixes salgados"
bca_salted_fish_description: "Preservado com sal, dando-lhe um sabor rico, salgado e uma textura firme. É comumente usado em várias cozinhas em todo o mundo."
bca_salted_haremeat: "Carne de lebre salgada"
bca_salted_haremeat_description: "Uma carne de caça preservada, curada com sal para um sabor rico e uma vida útil prolongada. Ideal para ensopados, assar ou pratos rústicos."
bca_salted_voltureegg: "Ovo de volumoso salgado"
bca_salted_voltureegg_description: "Uma delicadeza rara com um sabor rico, salgado, curado em sal para melhorar o seu sabor ousado, gamey. Perfeito para paladares aventureiros!"
bca_salted_wolfmeat: "Carne de Lobo Salgada"
